[project]
name = "cosmic-python"
version = "0.1.0"
description = "Cosmic Python - Architecture Patterns with Python (FastAPI + SQLAlchemy 2.0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[all]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-icdiff>=0.9",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]
